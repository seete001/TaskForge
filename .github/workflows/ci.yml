name: TaskForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t taskforge-api .
      - name: Build Worker image
        run: docker build -f Dockerfile.worker -t taskforge-worker .